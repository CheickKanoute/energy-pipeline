# Databricks Asset Bundle — déploiement du pipeline energy-pipeline
# Doc: https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: energy-pipeline

variables:
  catalog:
    default: energy

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<votre-workspace>.cloud.databricks.com
    resources:
      jobs:
        energy_pipeline_job:
          name: "[dev] energy-pipeline"

  prod:
    mode: production
    workspace:
      host: https://<votre-workspace>.cloud.databricks.com
    resources:
      jobs:
        energy_pipeline_job:
          name: "energy-pipeline"

resources:
  jobs:
    energy_pipeline_job:
      name: energy-pipeline
      job_clusters:
        - job_cluster_key: main_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"       # adapter selon le cloud (AWS ici)
            autoscale:
              min_workers: 2
              max_workers: 12               # dimensionné pour tenir un backlog large
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"

      tasks:
        - task_key: bronze_ingest
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ./src/bronze/ingest_bronze.py

        - task_key: silver_transform
          depends_on: [{task_key: bronze_ingest}]
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ./src/silver/transform_silver.py

        - task_key: gold_build
          depends_on: [{task_key: silver_transform}]
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ./src/gold/build_gold.py

        - task_key: train_forecast
          depends_on: [{task_key: gold_build}]
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ./src/mlops/train_forecast.py

      schedule:
        quartz_cron_expression: "0 0 3 * * ?"   # tous les jours à 3h
        timezone_id: "Europe/Paris"
